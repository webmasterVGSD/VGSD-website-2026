# Beheeromgeving van de VGSD-website (Sveltia CMS). Uitleg voor de webmaster: zie BEHEER.md.
# Hier staat welke formulieren de beheerder ziet. De gegevens zelf staan in de map data/.

backend:
  name: github
  repo: webmasterVGSD/VGSD-website-2026
  branch: main
  base_url: https://vgsd-cms-auth.webmaster-484.workers.dev
  commit_messages:
    create: 'Beheer: {{collection}} "{{slug}}" toegevoegd'
    update: 'Beheer: {{collection}} "{{slug}}" bijgewerkt'
    delete: 'Beheer: {{collection}} "{{slug}}" verwijderd'
    uploadMedia: 'Beheer: foto "{{path}}" toegevoegd'
    deleteMedia: 'Beheer: foto "{{path}}" verwijderd'

site_url: https://preview.vgsd.nl
logo_url: https://preview.vgsd.nl/images/logo/vgsd-logo.svg

# Foto's van besturen komen in deze map. De website leest het pad zoals het in de gegevens staat.
# Andere collecties (zoals Activiteiten) wijzen hun foto's naar een eigen map via media_folder/
# public_folder op het foto-veld zelf; dit is alleen de standaardmap voor de rest.
media_folder: /images/photos/besturen
public_folder: /images/photos/besturen

# Elke pagina van de site heeft hieronder een eigen collectie (ongeveer in de volgorde van het
# menu op de site). Binnen een collectie is elk blok van die pagina een eigen bestand in data/
# (bv. data/paginas/home/hero.json), zodat je na een klik op een pagina meteen alle blokken ziet.
# js/site.js laadt die blokken via <body data-pagina="..." data-blokken="..."> en vult de pagina.
# Instellingen (data/instellingen/) worden op alle pagina's gebruikt.
collections:
  - name: homepage
    label: Homepage
    icon: home
    files:
      - name: hero
        label: Bovenaan de pagina
        file: data/paginas/home/hero.json
        fields:
          - name: titel
            label: Grote titel
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
          - name: knopLidWorden
            label: Tekst op de rode knop
            widget: string
          - name: knopOpenAvonden
            label: Tekst op de tweede knop (naar open avonden)
            widget: string
          - name: foto
            label: Foto
            widget: image
            media_folder: /images/photos/home
            public_folder: /images/photos/home
            hint: >-
              Liefst een staande of vierkante foto (hij wordt rechts naast de titel getoond,
              ongeveer even hoog als breed). Liefst niet groter dan 1600 pixels.
          - name: fotoAlt
            label: Omschrijving van de foto
            widget: string
            hint: >-
              Voor blinden/slechtzienden en Google, bijvoorbeeld "Leden van VGSD lachen samen op de
              soosboot".
          - name: labelTitel
            label: Wit labeltje op de foto — vetgedrukte regel
            widget: string
          - name: labelTekst
            label: Wit labeltje op de foto — kleine regel
            widget: string
      - name: overOns
        label: Blok "Over ons" (met foto)
        file: data/paginas/home/overOns.json
        fields:
          - name: titel
            label: Titel
            widget: string
          - name: tekst
            label: Tekst
            widget: text
            hint: >-
              Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
              link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
          - name: foto
            label: Foto
            widget: image
            media_folder: /images/photos/home
            public_folder: /images/photos/home
          - name: fotoAlt
            label: Omschrijving van de foto
            widget: string
      - name: pijlers
        label: Blok "Waar we voor staan" (pijlers)
        file: data/paginas/home/pijlers.json
        fields:
          - name: titel
            label: Titel
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
          - name: kaarten
            label: Pijlers
            label_singular: Pijler
            widget: list
            collapsed: true
            summary: '{{titel}}'
            hint: Slepen verandert de volgorde. Vier kaarten past het mooist naast elkaar.
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: icoon
                label: Icoon
                widget: string
                hint: >-
                  De naam van een icoon van phosphoricons.com, zonder "ph-" ervoor (bijvoorbeeld
                  "cross" of "confetti").
              - name: highlight
                label: Rood uitgelicht
                widget: boolean
                default: false
              - name: tekst
                label: Tekst
                widget: text
      - name: leden
        label: Blok "Leden aan het woord"
        file: data/paginas/home/leden.json
        fields:
          - name: titel
            label: Titel
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
          - name: verhalen
            label: Verhalen
            label_singular: Verhaal
            widget: list
            collapsed: true
            summary: '{{naam}}'
            hint: Drie verhalen past het mooist naast elkaar.
            fields:
              - name: naam
                label: Naam
                widget: string
              - name: foto
                label: Pasfoto
                widget: image
                required: false
                media_folder: /images/photos/leden
                public_folder: /images/photos/leden
                hint: Wordt als klein rondje getoond; een vierkante foto van het gezicht werkt het best.
              - name: tekst
                label: Verhaal
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
      - name: instagram
        label: Blok "Volg ons op Instagram"
        file: data/paginas/home/instagram.json
        fields:
          - name: titel
            label: Titel
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
          - name: knop
            label: Tekst op de knop
            widget: string
            hint: De link van de knop is de Instagram-link uit Instellingen.
          - name: fotos
            label: Foto's
            label_singular: Foto
            widget: list
            required: false
            collapsed: true
            summary: '{{omschrijving}}'
            hint: >-
              Zes foto's vullen precies één rij. Zolang deze lijst leeg is, staan er lege tegels op
              de site. Vierkante foto's werken het best.
            fields:
              - name: foto
                label: Foto
                widget: image
                media_folder: /images/photos/instagram
                public_folder: /images/photos/instagram
              - name: omschrijving
                label: Omschrijving van de foto
                widget: string
  - name: activiteiten
    label: Activiteiten
    icon: celebration
    files:
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/activiteiten/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Hoofdtekst
            widget: text
          - name: subtekst
            label: Tweede regel
            widget: text
            hint: >-
              Hierna volgt altijd automatisch de vaste zin "Bekijk alle open avonden" met een link —
              dat stukje staat niet hier en kan niet worden aangepast.
      - name: kaarten
        label: Activiteitenkaarten
        file: data/paginas/activiteiten/kaarten.json
        fields:
          - name: kaarten
            label: Activiteitenkaarten
            label_singular: Activiteit
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{titel}}'
            hint: >-
              Eén kaart per activiteit. Slepen aan de linkerkant van een kaart (of de pijltjes in
              het menu ⋮) verandert de volgorde op de site. Nieuwe kaart toevoegen kan met de knop
              hieronder; verwijderen via het menu ⋮ op de kaart zelf.
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: icoon
                label: Icoon
                widget: string
                hint: >-
                  De naam van een icoon van phosphoricons.com (zoek daar het icoon op en gebruik de
                  naam die daar staat, bijvoorbeeld "book-open-text" of "trophy"), zonder "ph-"
                  ervoor.
              - name: highlight
                label: Rood uitgelicht
                widget: boolean
                default: false
                hint: >-
                  Zet dit aan om de kaart rood (in plaats van wit) te maken, voor de belangrijkste
                  of meest kenmerkende activiteiten. Zet niet te veel rode kaarten vlak na elkaar in
                  de volgorde — verspreid ze liever over de lijst.
              - name: foto
                label: Foto
                widget: vgsd-foto-activiteiten
                required: false
                media_folder: /images/photos/Activiteiten
                public_folder: /images/photos/Activiteiten
                hint: >-
                  Upload de foto, sleep hem in het kader om te bepalen welk deel zichtbaar blijft,
                  en klik op Opslaan. De foto wordt automatisch verkleind. Zonder foto toont de
                  kaart alleen het icoon en de tekst.
              - name: tekst
                label: Korte omschrijving
                widget: text
                hint: Staat altijd zichtbaar op de kaart, ook als hij is ingeklapt.
              - name: leesMeer
                label: Uitgebreide tekst ("Lees meer")
                widget: text
                required: false
                hint: >-
                  Laat dit leeg voor kaarten zonder "Lees meer"-knop (bijvoorbeeld omdat de korte
                  omschrijving al genoeg zegt). Laat een lege regel tussen alinea's.
  - name: open_avonden
    label: Open avonden
    icon: event
    files:
      - name: kalender
        label: Kalender met open avonden
        file: data/activiteiten.json
        fields:
          - name: openAvonden
            label: Open avonden
            label_singular: Open avond
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{datum}} — {{titel}}'
            hint: >-
              De site toont automatisch de eerstvolgende open avond in de footer. Verlopen avonden
              mogen blijven staan of worden opgeruimd.
            fields:
              - name: datum
                label: Datum en tijd
                widget: datetime
                format: YYYY-MM-DD[T]HH:mm
              - name: titel
                label: Titel
                widget: string
              - name: locatie
                label: Locatie
                widget: string
              - name: omschrijving
                label: Omschrijving
                widget: text
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/open-avonden/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Hoofdtekst
            widget: text
          - name: subtekst
            label: Tweede alinea (grijs)
            widget: text
            hint: >-
              Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
              link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
      - name: leeg
        label: Tekst als er geen open avonden gepland zijn
        file: data/paginas/open-avonden/leeg.json
        fields:
          - name: tekst
            label: Tekst
            widget: text
      - name: cta
        label: Rood blok onderaan
        file: data/paginas/open-avonden/cta.json
        fields:
          - name: titel
            label: Titel
            widget: string
          - name: tekst
            label: Tekst
            widget: text
  - name: besturen
    label: Besturen
    icon: groups
    files:
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/besturen/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
            hint: >-
              Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
              link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
          - name: eerdereBesturenTitel
            label: Kop boven de oudere besturen
            widget: string
      - name: besturen
        label: Alle besturen
        file: data/besturen.json
        fields:
          - name: besturen
            label: Besturen
            label_singular: Bestuur
            widget: list
            add_to_top: true
            collapsed: true
            summary: Bestuur {{naam}} — {{praeses}}
            hint: >-
              Nieuwste bestuur bovenaan. Het bovenste bestuur wordt op de website groot uitgelicht
              als huidig bestuur. Een nieuw bestuur voeg je toe met de knop bovenaan de lijst.
            fields:
              - name: naam
                label: Naam van het bestuur
                widget: string
                hint: >-
                  De achternaam van de praeses, zonder het woord "Bestuur", bijvoorbeeld "de Jong".
                  Komt dezelfde achternaam vaker voor, voeg dan een Romeins cijfer toe: "de Jong
                  II".
              - name: praeses
                label: Praeses
                widget: string
              - name: abactis
                label: Abactis
                widget: string
              - name: fiscus
                label: Fiscus
                widget: string
                required: false
              - name: assessor
                label: Assessor
                widget: string
                required: false
                hint: Alleen invullen als het bestuur een assessor heeft.
              - name: foto
                label: Foto
                widget: vgsd-foto
                required: false
                hint: >-
                  Liefst een liggende groepsfoto. Upload de foto, sleep hem in het kader om te
                  bepalen welk deel zichtbaar blijft, en klik op Opslaan. De foto wordt automatisch
                  verkleind. Zonder foto wordt op de website geen fotovlak getoond.
              - name: quote
                label: Quote
                widget: string
                required: false
                hint: >-
                  Bijvoorbeeld: We hit turbulence ~ S. Aoki. Het deel na het ~-teken (de bron) mag
                  ontbreken.
              - name: tekst
                label: Bestuurstekst
                widget: text
                required: false
                hint: Laat een lege regel tussen alinea's.
  - name: geschiedenis
    label: Geschiedenis
    icon: history_edu
    files:
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/geschiedenis/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
      - name: tijdlijn
        label: Tijdlijn
        file: data/paginas/geschiedenis/tijdlijn.json
        fields:
          - name: titel
            label: Titel boven de tijdlijn
            widget: string
          - name: tekst
            label: Tekst boven de tijdlijn
            widget: text
          - name: stappen
            label: Stappen
            label_singular: Tijdlijnstap
            widget: list
            collapsed: true
            summary: '{{periode}} — {{titel}}'
            hint: >-
              Van oud naar nieuw, van boven naar onder. Slepen verandert de volgorde. Zet "Dit is de
              huidige/laatste stap" alleen aan bij de laatste stap in de lijst (die krijgt een iets
              groter bolletje op de tijdlijn).
            fields:
              - name: periode
                label: Periode
                widget: string
                hint: Bijvoorbeeld "Begin 1961" of "Vandaag".
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst
                widget: text
              - name: huidig
                label: Dit is de huidige/laatste stap
                widget: boolean
                default: false
  - name: verbanden
    label: Verbanden
    icon: handshake
    files:
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/verbanden/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
      - name: kaarten
        label: Verbanden (kaarten)
        file: data/paginas/verbanden/kaarten.json
        fields:
          - name: kaarten
            label: Verbanden
            label_singular: Verband
            widget: list
            collapsed: true
            summary: '{{titel}}'
            hint: Slepen verandert de volgorde op de site.
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: icoon
                label: Icoon
                widget: string
                hint: >-
                  De naam van een icoon van phosphoricons.com, zonder "ph-" ervoor (bijvoorbeeld
                  "handshake").
              - name: tekst
                label: Tekst
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
              - name: labels
                label: Labeltjes onder de tekst
                label_singular: Labeltje
                widget: list
                required: false
                field:
                  name: label
                  label: Tekst
                  widget: string
                hint: Bijvoorbeeld de steden van de zusterverenigingen. Mag leeg blijven.
  - name: disputen
    label: Disputen
    icon: groups
    files:
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/disputen/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
      - name: disputen
        label: Disputen
        file: data/paginas/disputen/disputen.json
        fields:
          - name: disputen
            label: Disputen
            label_singular: Dispuut
            widget: list
            collapsed: true
            summary: '{{naam}}'
            hint: Slepen verandert de volgorde op de site.
            fields:
              - name: tonen
                label: Tonen op de site
                widget: boolean
                default: true
                hint: Zet uit om dit dispuut tijdelijk van de site te halen.
              - name: naam
                label: Naam
                widget: string
              - name: logo
                label: Logo (optioneel)
                widget: image
                required: false
                media_folder: /images/photos/disputen
                public_folder: /images/photos/disputen
                hint: Liefst een PNG met transparante achtergrond. Komt in een rondje naast de naam.
              - name: motto
                label: Motto of ondertitel (optioneel)
                widget: string
                required: false
              - name: foto
                label: Foto (optioneel)
                widget: vgsd-foto-activiteiten
                required: false
                media_folder: /images/photos/disputen
                public_folder: /images/photos/disputen
                hint: >-
                  Upload de foto, sleep hem in het kader om te bepalen welk deel zichtbaar blijft, en
                  klik op Opslaan. Zonder foto loopt de tekst over de volle breedte.
              - name: fotoHeel
                label: Foto helemaal tonen (niet bijsnijden)
                widget: boolean
                default: false
                required: false
                hint: Aanzetten voor een logo of tekening, zoals bij Ad Fontes. Het bijsnijden hierboven telt dan niet.
              - name: tekst
                label: Tekst
                widget: text
                hint: "Laat een lege regel tussen alinea's. Opmaak: **vet** en [linktekst](adres)."
  - name: kasten
    label: Kasten
    icon: house
    files:
      - name: intro
        label: Tekst bovenaan de pagina
        file: data/paginas/kasten/intro.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
      - name: kasten
        label: Kasten
        file: data/paginas/kasten/kasten.json
        fields:
          - name: kasten
            label: Kasten
            label_singular: Kast
            widget: list
            collapsed: true
            summary: '{{naam}} — {{gebied}}'
            hint: >-
              Slepen verandert de volgorde van de kaartjes onder de kaart. Elke kast krijgt een pin
              op de kaart.
            fields:
              - name: naam
                label: Naam
                widget: string
              - name: gebied
                label: Gebied
                widget: string
                hint: Bijvoorbeeld "Bij station Delft". Wordt nu alleen in het beheer gebruikt.
              - name: lat
                label: Breedtegraad (pin op de kaart)
                widget: number
                value_type: float
                hint: >-
                  Rechtsklik in Google Maps op de plek en klik op de coördinaten om ze te kopiëren:
                  het eerste getal (bv. 52.0093) komt hier, het tweede hieronder. Bewust een plek in
                  de buurt en geen exact adres, vanwege de privacy van de bewoners.
              - name: lon
                label: Lengtegraad (pin op de kaart)
                widget: number
                value_type: float
                hint: Het tweede getal, bijvoorbeeld 4.3548.
              - name: foto
                label: Foto
                widget: vgsd-foto-activiteiten
                required: false
                media_folder: /images/photos/Kasten
                public_folder: /images/photos/Kasten
                hint: >-
                  Upload de foto, sleep hem in het kader om te bepalen welk deel zichtbaar blijft op
                  het kaartje, en klik op Opslaan. De foto wordt automatisch verkleind.
              - name: tekst
                label: Tekst (in de popup)
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, ~~doorgestreept~~ en
                  [linktekst](adres) voor een link.
  - name: vvgsd
    label: VVGSD
    icon: sports_soccer
    files:
      - name: hoofdpagina
        label: Teksten op de VVGSD-pagina
        file: data/paginas/vvgsd/hoofdpagina.json
        fields:
          - name: titel
            label: Titel (H1)
            widget: string
          - name: tekst
            label: Tekst onder de titel
            widget: text
          - name: kopVolgendeWedstrijd
            label: Kopje boven de eerstvolgende wedstrijd
            widget: string
          - name: kopTopscorers
            label: Kop boven de topscorers
            widget: string
          - name: kopVerslagen
            label: Kop boven de wedstrijdverslagen
            widget: string
          - name: ctaTitel
            label: Titel rood blok onderaan
            widget: string
          - name: ctaTekst
            label: Tekst rood blok onderaan
            widget: text
      - name: groepsfoto
        label: Groepsfoto
        file: data/paginas/vvgsd/groepsfoto.json
        fields:
          - name: foto
            label: Groepsfoto
            widget: image
            required: false
            media_folder: /images/photos/vvgsd
            public_folder: /images/photos/vvgsd
            hint: Foto voor bovenaan de VVGSD-pagina. Snijd de foto van tevoren zelf bij indien nodig.
      - name: statistieken
        label: Topscorers
        file: data/paginas/vvgsd/statistieken.json
        fields:
          - name: topscorers
            label: Topscorers
            label_singular: Topscorer
            widget: list
            collapsed: true
            summary: '{{naam}} — {{aantalDoelpunten}}'
            fields:
              - name: naam
                label: Naam
                widget: string
              - name: aantalDoelpunten
                label: Aantal doelpunten
                widget: number
                value_type: int
      - name: wedstrijdverslagen
        label: Wedstrijdverslagen
        file: data/paginas/vvgsd/wedstrijdverslagen.json
        fields:
          - name: verslagen
            label: Wedstrijdverslagen
            label_singular: Verslag
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{datum}} — {{titel}}'
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: datum
                label: Datum
                widget: datetime
                format: YYYY-MM-DD
                time_format: false
                picker_utc: true
              - name: tekst
                label: Tekst
                widget: text
                hint: Laat een lege regel tussen alinea's.
      - name: standEnSchema
        label: Stand en schema (Playpass-koppeling en handmatige invoer)
