# Beheeromgeving van de VGSD-website (Sveltia CMS). Uitleg voor de webmaster: zie BEHEER.md.
# Hier staat welke formulieren de beheerder ziet. De gegevens zelf staan in de map data/.

backend:
  name: github
  repo: webmasterVGSD/VGSD-website-2026
  branch: main
  base_url: https://vgsd-cms-auth.webmaster-484.workers.dev
  commit_messages:
    create: 'Beheer: {{collection}} "{{slug}}" toegevoegd'
    update: 'Beheer: {{collection}} "{{slug}}" bijgewerkt'
    delete: 'Beheer: {{collection}} "{{slug}}" verwijderd'
    uploadMedia: 'Beheer: foto "{{path}}" toegevoegd'
    deleteMedia: 'Beheer: foto "{{path}}" verwijderd'

site_url: https://preview.vgsd.nl
logo_url: https://preview.vgsd.nl/images/logo/vgsd-logo.svg

# Foto's van besturen komen in deze map. De website leest het pad zoals het in de gegevens staat.
# Andere collecties (zoals Activiteiten) wijzen hun foto's naar een eigen map via media_folder/
# public_folder op het foto-veld zelf; dit is alleen de standaardmap voor de rest.
media_folder: /images/photos/besturen
public_folder: /images/photos/besturen

# Elke pagina van de site heeft hieronder een eigen collectie, in ongeveer dezelfde volgorde als
# het menu op de site (zo vind je snel wat je zoekt in het menu links), en dan Instellingen voor de
# gegevens die op de hele site gebruikt worden (WhatsApp, contact, social media, footer).
# Teksten van pagina's staan in data/paginas/; js/site.js vult ze in via data-inhoud-attributen.
collections:
  # ---------------------------------------------------------------------------------------------
  - name: homepage
    label: Homepage
    icon: home
    files:
      - name: homepage
        label: Homepage
        file: data/paginas/home.json
        fields:
          - name: hero
            label: Bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Grote titel
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
              - name: knopLidWorden
                label: Tekst op de rode knop
                widget: string
              - name: knopOpenAvonden
                label: Tekst op de tweede knop (naar open avonden)
                widget: string
              - name: foto
                label: Foto
                widget: image
                media_folder: /images/photos/home
                public_folder: /images/photos/home
                hint: >-
                  Liefst een staande of vierkante foto (hij wordt rechts naast de titel getoond, ongeveer
                  even hoog als breed). Liefst niet groter dan 1600 pixels.
              - name: fotoAlt
                label: Omschrijving van de foto
                widget: string
                hint: Voor blinden/slechtzienden en Google, bijvoorbeeld "Leden van VGSD lachen samen op de soosboot".
              - name: labelTitel
                label: Wit labeltje op de foto — vetgedrukte regel
                widget: string
              - name: labelTekst
                label: Wit labeltje op de foto — kleine regel
                widget: string
          - name: overOns
            label: Blok "Over ons" (met foto)
            widget: object
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
              - name: foto
                label: Foto
                widget: image
                media_folder: /images/photos/home
                public_folder: /images/photos/home
              - name: fotoAlt
                label: Omschrijving van de foto
                widget: string
          - name: pijlers
            label: Blok "Waar we voor staan" (pijlers)
            widget: object
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
              - name: kaarten
                label: Pijlers
                label_singular: Pijler
                widget: list
                collapsed: true
                summary: '{{titel}}'
                hint: Slepen verandert de volgorde. Vier kaarten past het mooist naast elkaar.
                fields:
                  - name: titel
                    label: Titel
                    widget: string
                  - name: icoon
                    label: Icoon
                    widget: string
                    hint: >-
                      De naam van een icoon van phosphoricons.com, zonder "ph-" ervoor (bijvoorbeeld
                      "cross" of "confetti").
                  - name: highlight
                    label: Rood uitgelicht
                    widget: boolean
                    default: false
                  - name: tekst
                    label: Tekst
                    widget: text
          - name: leden
            label: Blok "Leden aan het woord"
            widget: object
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
              - name: verhalen
                label: Verhalen
                label_singular: Verhaal
                widget: list
                collapsed: true
                summary: '{{naam}}'
                hint: Drie verhalen past het mooist naast elkaar.
                fields:
                  - name: naam
                    label: Naam
                    widget: string
                  - name: foto
                    label: Pasfoto
                    widget: image
                    required: false
                    media_folder: /images/photos/leden
                    public_folder: /images/photos/leden
                    hint: Wordt als klein rondje getoond; een vierkante foto van het gezicht werkt het best.
                  - name: tekst
                    label: Verhaal
                    widget: text
                    hint: >-
                      Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                      link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
          - name: instagram
            label: Blok "Volg ons op Instagram"
            widget: object
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
              - name: knop
                label: Tekst op de knop
                widget: string
                hint: De link van de knop is de Instagram-link uit Instellingen.
              - name: fotos
                label: Foto's
                label_singular: Foto
                widget: list
                required: false
                collapsed: true
                summary: '{{omschrijving}}'
                hint: >-
                  Zes foto's vullen precies één rij. Zolang deze lijst leeg is, staan er lege tegels op
                  de site. Vierkante foto's werken het best.
                fields:
                  - name: foto
                    label: Foto
                    widget: image
                    media_folder: /images/photos/instagram
                    public_folder: /images/photos/instagram
                  - name: omschrijving
                    label: Omschrijving van de foto
                    widget: string

  # ---------------------------------------------------------------------------------------------
  - name: activiteiten_overzicht
    label: Activiteiten
    icon: celebration
    files:
      - name: activiteiten_overzicht
        label: Activiteitenpagina
        file: data/activiteiten-overzicht.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Hoofdtekst
                widget: text
              - name: subtekst
                label: Tweede regel
                widget: text
                hint: >-
                  Hierna volgt altijd automatisch de vaste zin "Bekijk alle open avonden" met een
                  link — dat stukje staat niet hier en kan niet worden aangepast.
          - name: kaarten
            label: Activiteitenkaarten
            label_singular: Activiteit
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{titel}}'
            hint: >-
              Eén kaart per activiteit. Slepen aan de linkerkant van een kaart (of de pijltjes in
              het menu ⋮) verandert de volgorde op de site. Nieuwe kaart toevoegen kan met de knop
              hieronder; verwijderen via het menu ⋮ op de kaart zelf.
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: icoon
                label: Icoon
                widget: string
                hint: >-
                  De naam van een icoon van phosphoricons.com (zoek daar het icoon op en gebruik de
                  naam die daar staat, bijvoorbeeld "book-open-text" of "trophy"), zonder "ph-" ervoor.
              - name: highlight
                label: Rood uitgelicht
                widget: boolean
                default: false
                hint: >-
                  Zet dit aan om de kaart rood (in plaats van wit) te maken, voor de belangrijkste of
                  meest kenmerkende activiteiten. Zet niet te veel rode kaarten vlak na elkaar in de
                  volgorde — verspreid ze liever over de lijst.
              - name: foto
                label: Foto
                widget: vgsd-foto-activiteiten
                required: false
                media_folder: /images/photos/Activiteiten
                public_folder: /images/photos/Activiteiten
                hint: >-
                  Upload de foto, sleep hem in het kader om te bepalen welk deel zichtbaar blijft, en
                  klik op Opslaan. De foto wordt automatisch verkleind. Zonder foto toont de kaart
                  alleen het icoon en de tekst.
              - name: tekst
                label: Korte omschrijving
                widget: text
                hint: Staat altijd zichtbaar op de kaart, ook als hij is ingeklapt.
              - name: leesMeer
                label: Uitgebreide tekst ("Lees meer")
                widget: text
                required: false
                hint: >-
                  Laat dit leeg voor kaarten zonder "Lees meer"-knop (bijvoorbeeld omdat de korte
                  omschrijving al genoeg zegt). Laat een lege regel tussen alinea's.

  # ---------------------------------------------------------------------------------------------
  - name: open_avonden
    label: Open avonden
    icon: event
    files:
      - name: open_avonden
        label: Kalender met open avonden
        file: data/activiteiten.json
        fields:
          - name: openAvonden
            label: Open avonden
            label_singular: Open avond
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{datum}} — {{titel}}'
            hint: >-
              De site toont automatisch de eerstvolgende open avond in de footer. Verlopen avonden
              mogen blijven staan of worden opgeruimd.
            fields:
              - name: datum
                label: Datum en tijd
                widget: datetime
                format: 'YYYY-MM-DD[T]HH:mm'
              - name: titel
                label: Titel
                widget: string
              - name: locatie
                label: Locatie
                widget: string
              - name: omschrijving
                label: Omschrijving
                widget: text
      - name: open_avonden_pagina
        label: Teksten op de pagina
        file: data/paginas/open-avonden.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Hoofdtekst
                widget: text
              - name: subtekst
                label: Tweede alinea (grijs)
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
          - name: leegTekst
            label: Tekst als er geen open avonden gepland zijn
            widget: text
          - name: cta
            label: Rood blok onderaan
            widget: object
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst
                widget: text

  # ---------------------------------------------------------------------------------------------
  - name: besturen
    label: Besturen
    icon: groups
    files:
      - name: besturen
        label: Alle besturen
        file: data/besturen.json
        fields:
          - name: besturen
            label: Besturen
            label_singular: Bestuur
            widget: list
            add_to_top: true
            collapsed: true
            summary: 'Bestuur {{naam}} — {{praeses}}'
            hint: >-
              Nieuwste bestuur bovenaan. Het bovenste bestuur wordt op de website groot uitgelicht
              als huidig bestuur. Een nieuw bestuur voeg je toe met de knop bovenaan de lijst.
            fields:
              - name: naam
                label: Naam van het bestuur
                widget: string
                hint: >-
                  De achternaam van de praeses, zonder het woord "Bestuur", bijvoorbeeld "de Jong".
                  Komt dezelfde achternaam vaker voor, voeg dan een Romeins cijfer toe: "de Jong II".
              - name: praeses
                label: Praeses
                widget: string
              - name: abactis
                label: Abactis
                widget: string
              - name: fiscus
                label: Fiscus
                widget: string
                required: false
              - name: assessor
                label: Assessor
                widget: string
                required: false
                hint: Alleen invullen als het bestuur een assessor heeft.
              - name: foto
                label: Foto
                widget: vgsd-foto
                required: false
                hint: >-
                  Liefst een liggende groepsfoto. Upload de foto, sleep hem in het kader om te bepalen
                  welk deel zichtbaar blijft, en klik op Opslaan. De foto wordt automatisch verkleind.
                  Zonder foto wordt op de website geen fotovlak getoond.
              - name: quote
                label: Quote
                widget: string
                required: false
                hint: 'Bijvoorbeeld: We hit turbulence ~ S. Aoki. Het deel na het ~-teken (de bron) mag ontbreken.'
              - name: tekst
                label: Bestuurstekst
                widget: text
                required: false
                hint: Laat een lege regel tussen alinea's.
      - name: besturen_pagina
        label: Teksten op de pagina
        file: data/paginas/besturen.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
          - name: eerdereBesturenTitel
            label: Kop boven de oudere besturen
            widget: string

  # ---------------------------------------------------------------------------------------------
  - name: geschiedenis
    label: Geschiedenis
    icon: history_edu
    files:
      - name: geschiedenis
        label: Geschiedenispagina
        file: data/geschiedenis.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
              - name: sectieTitel
                label: Titel boven de tijdlijn
                widget: string
              - name: sectieTekst
                label: Tekst boven de tijdlijn
                widget: text
          - name: tijdlijn
            label: Tijdlijn
            label_singular: Tijdlijnstap
            widget: list
            collapsed: true
            summary: '{{periode}} — {{titel}}'
            hint: >-
              Van oud naar nieuw, van boven naar onder. Slepen verandert de volgorde. Zet "Dit is de
              huidige/laatste stap" alleen aan bij de laatste stap in de lijst (die krijgt een iets
              groter bolletje op de tijdlijn).
            fields:
              - name: periode
                label: Periode
                widget: string
                hint: 'Bijvoorbeeld "Begin 1961" of "Vandaag".'
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst
                widget: text
              - name: huidig
                label: Dit is de huidige/laatste stap
                widget: boolean
                default: false

  # ---------------------------------------------------------------------------------------------
  - name: verbanden
    label: Verbanden
    icon: handshake
    files:
      - name: verbanden
        label: Verbandenpagina
        file: data/paginas/verbanden.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
          - name: kaarten
            label: Verbanden
            label_singular: Verband
            widget: list
            collapsed: true
            summary: '{{titel}}'
            hint: Slepen verandert de volgorde op de site.
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: icoon
                label: Icoon
                widget: string
                hint: De naam van een icoon van phosphoricons.com, zonder "ph-" ervoor (bijvoorbeeld "handshake").
              - name: tekst
                label: Tekst
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
              - name: labels
                label: Labeltjes onder de tekst
                label_singular: Labeltje
                widget: list
                required: false
                field:
                  name: label
                  label: Tekst
                  widget: string
                hint: Bijvoorbeeld de steden van de zusterverenigingen. Mag leeg blijven.

  # ---------------------------------------------------------------------------------------------
  - name: kasten
    label: Kasten
    icon: house
    files:
      - name: kasten
        label: Kastenpagina
        file: data/paginas/kasten.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
          - name: kasten
            label: Kasten
            label_singular: Kast
            widget: list
            collapsed: true
            summary: '{{naam}} — {{gebied}}'
            hint: >-
              Slepen verandert de volgorde van de kaartjes onder de kaart. Elke kast krijgt een pin op
              de kaart.
            fields:
              - name: naam
                label: Naam
                widget: string
              - name: gebied
                label: Gebied
                widget: string
                hint: 'Bijvoorbeeld "Bij station Delft". Wordt nu alleen in het beheer gebruikt.'
              - name: lat
                label: Breedtegraad (pin op de kaart)
                widget: number
                value_type: float
                hint: >-
                  Rechtsklik in Google Maps op de plek en klik op de coördinaten om ze te kopiëren: het
                  eerste getal (bv. 52.0093) komt hier, het tweede hieronder. Bewust een plek in de buurt
                  en geen exact adres, vanwege de privacy van de bewoners.
              - name: lon
                label: Lengtegraad (pin op de kaart)
                widget: number
                value_type: float
                hint: Het tweede getal, bijvoorbeeld 4.3548.
              - name: foto
                label: Foto
                widget: vgsd-foto-activiteiten
                required: false
                media_folder: /images/photos/Kasten
                public_folder: /images/photos/Kasten
                hint: >-
                  Upload de foto, sleep hem in het kader om te bepalen welk deel zichtbaar blijft op het
                  kaartje, en klik op Opslaan. De foto wordt automatisch verkleind.
              - name: tekst
                label: Tekst (in de popup)
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, ~~doorgestreept~~ en
                  [linktekst](adres) voor een link.

  # ---------------------------------------------------------------------------------------------
  - name: vvgsd
    label: VVGSD
    icon: sports_soccer
    files:
      - name: vvgsd_teksten
        label: Teksten op de pagina's
        file: data/paginas/vvgsd.json
        fields:
          - name: hoofdpagina
            label: VVGSD-pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
              - name: kopVolgendeWedstrijd
                label: Kopje boven de eerstvolgende wedstrijd
                widget: string
              - name: kopTopscorers
                label: Kop boven de topscorers
                widget: string
              - name: kopVerslagen
                label: Kop boven de wedstrijdverslagen
                widget: string
              - name: ctaTitel
                label: Titel rood blok onderaan
                widget: string
              - name: ctaTekst
                label: Tekst rood blok onderaan
                widget: text
          - name: stand
            label: Standpagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
          - name: schema
            label: Wedstrijdschemapagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text

      - name: vvgsd
        label: Voetbalteam
        file: data/vvgsd-instellingen.json
        fields:
          - name: groepsfoto
            label: Groepsfoto
            widget: object
            fields:
              - name: foto
                label: Groepsfoto
                widget: image
                required: false
                media_folder: /images/photos/vvgsd
                public_folder: /images/photos/vvgsd
                hint: Foto voor bovenaan de VVGSD-pagina. Snijd de foto van tevoren zelf bij indien nodig.

          - name: statistieken
            label: Statistieken
            widget: object
            fields:
              - name: topscorers
                label: Topscorers
                label_singular: Topscorer
                widget: list
                collapsed: true
                summary: '{{naam}} — {{aantalDoelpunten}}'
                fields:
                  - name: naam
                    label: Naam
                    widget: string
                  - name: aantalDoelpunten
                    label: Aantal doelpunten
                    widget: number
                    value_type: int

          - name: wedstrijdverslagen
            label: Wedstrijdverslagen
            widget: object
            fields:
              - name: verslagen
                label: Wedstrijdverslagen
                label_singular: Verslag
                widget: list
                add_to_top: true
                collapsed: true
                summary: '{{datum}} — {{titel}}'
                fields:
                  - name: titel
                    label: Titel
                    widget: string
                  - name: datum
                    label: Datum
                    widget: datetime
                    format: 'YYYY-MM-DD'
                    time_format: false
                    picker_utc: true
                  - name: tekst
                    label: Tekst
                    widget: text
                    hint: Laat een lege regel tussen alinea's.

          - name: standEnSchema
            label: Stand en schema
            widget: object
            fields:
              - name: bronUrl
                label: Bron op Playpass
                widget: string
                hint: >-
                  De link naar de poule van VVGSD op Playpass. Verandert deze (bv. een nieuw seizoen),
                  pas hem dan hier aan — de automatische bijwerking gebruikt deze link.
              - name: teamNaam
                label: Teamnaam zoals die op Playpass staat
                widget: string
                hint: 'Nu: "VVGSD". Wordt gebruikt om VVGSD te herkennen en uit te lichten in de stand en het schema.'
              - name: standKolommen
                label: Koppeling kolomkoppen op Playpass (automatische stand)
                widget: object
                hint: >-
                  Voor elk van deze velden: de Engelse koptekst zoals die op de Playpass-standenpagina
                  staat (beweeg over een kolomkop op Playpass om de volledige naam te zien, bv. "Points").
                  Verandert Playpass een koptekst, pas 'm dan hier aan — dan werkt de automatische
                  bijwerking weer, zonder dat er iets in de code hoeft te veranderen.
                fields:
                  - name: gespeeld
                    label: Kolomkop voor "gespeeld"
                    widget: string
                  - name: gewonnen
                    label: Kolomkop voor "gewonnen"
                    widget: string
                  - name: gelijk
                    label: Kolomkop voor "gelijkgespeeld"
                    widget: string
                  - name: verloren
                    label: Kolomkop voor "verloren"
                    widget: string
                  - name: doelpuntenVoor
                    label: Kolomkop voor "doelpunten voor"
                    widget: string
                  - name: doelpuntenTegen
                    label: Kolomkop voor "doelpunten tegen"
                    widget: string
                  - name: doelsaldo
                    label: Kolomkop voor "doelsaldo"
                    widget: string
                  - name: punten
                    label: Kolomkop voor "punten"
                    widget: string
              - name: standHandmatig
                label: Stand handmatig invoeren (i.p.v. automatisch)
                widget: boolean
                default: false
                hint: >-
                  Alleen aanzetten als de automatische bijwerking niet meer werkt (bv. omdat Playpass
                  van opzet is veranderd). Zet 'm aan en vul de tabel hieronder in; de site gebruikt
                  dan deze tabel in plaats van de automatisch opgehaalde stand.
              - name: standTeams
                label: Handmatige stand
                label_singular: Team
                widget: list
                collapsed: true
                summary: '{{positie}}. {{naam}} — {{punten}} pt'
                fields:
                  - name: positie
                    label: Positie
                    widget: number
                    value_type: int
                  - name: naam
                    label: Teamnaam
                    widget: string
                  - name: gespeeld
                    label: Gespeeld
                    widget: number
                    value_type: int
                  - name: gewonnen
                    label: Gewonnen
                    widget: number
                    value_type: int
                  - name: gelijk
                    label: Gelijk
                    widget: number
                    value_type: int
                  - name: verloren
                    label: Verloren
                    widget: number
                    value_type: int
                  - name: doelpuntenVoor
                    label: Doelpunten voor
                    widget: number
                    value_type: int
                  - name: doelpuntenTegen
                    label: Doelpunten tegen
                    widget: number
                    value_type: int
                  - name: doelsaldo
                    label: Doelsaldo
                    widget: number
                    value_type: int
                  - name: punten
                    label: Punten
                    widget: number
                    value_type: int
              - name: schemaHandmatig
                label: Wedstrijdschema handmatig invoeren (i.p.v. automatisch)
                widget: boolean
                default: false
                hint: Zelfde idee als bij de stand hierboven, maar dan voor het wedstrijdschema.
              - name: schemaWedstrijden
                label: Handmatig wedstrijdschema
                label_singular: Wedstrijd
                widget: list
                add_to_top: true
                collapsed: true
                summary: '{{datum}} — {{thuis}} - {{uit}}'
                fields:
                  - name: datum
                    label: Datum
                    widget: datetime
                    format: 'YYYY-MM-DD'
                    time_format: false
                    picker_utc: true
                  - name: tijd
                    label: Tijd
                    widget: string
                    hint: 'Bijvoorbeeld 19:00.'
                  - name: thuis
                    label: Thuisteam
                    widget: string
                  - name: uit
                    label: Uitteam
                    widget: string
                  - name: gespeeld
                    label: Gespeeld
                    widget: boolean
                    default: false
                  - name: thuisScore
                    label: Doelpunten thuisteam
                    widget: number
                    value_type: int
                    required: false
                  - name: uitScore
                    label: Doelpunten uitteam
                    widget: number
                    value_type: int
                    required: false
                  - name: veld
                    label: Veld
                    widget: string
                    required: false
                  - name: wedstrijdnummer
                    label: Wedstrijdnummer
                    widget: number
                    value_type: int
                    required: false

  # ---------------------------------------------------------------------------------------------
  - name: veelgestelde_vragen
    label: Veelgestelde vragen
    icon: help
    files:
      - name: veelgestelde_vragen
        label: Veelgestelde vragen
        file: data/paginas/veelgestelde-vragen.json
        fields:
          - name: intro
            label: Tekst bovenaan de pagina
            widget: object
            fields:
              - name: titel
                label: Titel (H1)
                widget: string
              - name: tekst
                label: Tekst onder de titel
                widget: text
          - name: vragen
            label: Vragen
            label_singular: Vraag
            widget: list
            collapsed: true
            summary: '{{vraag}}'
            hint: Slepen verandert de volgorde op de site.
            fields:
              - name: vraag
                label: Vraag
                widget: string
              - name: antwoord
                label: Antwoord
                widget: text
                hint: >-
                  Laat een lege regel tussen alinea's. Opmaak: **vet**, [linktekst](adres) voor een
                  link, en {emailPr}, {email} of {telefoon} voor het adres/nummer uit Instellingen.
          - name: cta
            label: Rood blok onderaan
            widget: object
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst
                widget: text
                hint: De knop eronder mailt altijd naar het PR-adres uit Instellingen.

  # ---------------------------------------------------------------------------------------------
  - name: instellingen
    label: Instellingen
    icon: settings
    files:
      - name: site
        label: Algemene instellingen (WhatsApp, contact, footer)
        file: data/site.json
        fields:
          - name: whatsapp
            label: WhatsApp
            widget: object
            fields:
              - name: nummer
                label: WhatsApp-nummer
                widget: string
                pattern: ['^\d{8,15}$', 'Alleen cijfers, zonder plus of spaties. Bijvoorbeeld 31633891980.']
                hint: >-
                  Internationaal formaat, alleen cijfers. Dit nummer wordt gebruikt voor de zwevende
                  WhatsApp-knop en alle "Meld je aan"-knoppen.
          - name: contact
            label: Contactgegevens
            widget: object
            fields:
              - name: adres
                label: Adres
                widget: text
                hint: Eén regel per adresregel (straat en huisnummer, dan postcode en plaats).
              - name: email
                label: E-mailadres (footer)
                widget: string
                type: email
              - name: emailPr
                label: E-mailadres PR (veelgestelde vragen)
                widget: string
                type: email
              - name: telefoon
                label: Telefoonnummer
                widget: string
                hint: Zoals het op de website moet staan, bijvoorbeeld 06 33 89 19 80.
          - name: social
            label: Sociale media
            widget: object
            fields:
              - name: instagram
                label: Instagram-link
                widget: string
                type: url
                required: false
                hint: De volledige link naar het Instagram-account. Leeg laten als er (nog) geen is.
          - name: cta
            label: Rood blok "Nieuwsgierig geworden?" onderaan pagina's
            widget: object
            hint: >-
              Staat onderaan Activiteiten, Besturen, Geschiedenis, Kasten en Verbanden. (Open avonden,
              VVGSD en Veelgestelde vragen hebben een eigen versie, die pas je bij die pagina aan.)
            fields:
              - name: titel
                label: Titel
                widget: string
              - name: tekst
                label: Tekst
                widget: text
              - name: knopOpenAvonden
                label: Tekst op de witte knop (naar open avonden)
                widget: string
              - name: knopLidWorden
                label: Tekst op de tweede knop (lid worden)
                widget: string
          - name: footer
            label: Footer (onderaan elke pagina)
            widget: object
            fields:
              - name: tekst
                label: Korte omschrijving onder het logo
                widget: text
              - name: copyright
                label: Regel linksonder
                widget: string
              - name: slogan
                label: Regel rechtsonder
                widget: string
