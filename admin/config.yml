      - name: social
        label: Sociale media
        file: data/instellingen/social.json
        fields:
          - name: instagram
            label: Instagram-link
            widget: string
            type: url
            required: false
            hint: De volledige link naar het Instagram-account. Leeg laten als er (nog) geen is.
      - name: cta
        label: Rood blok "Nieuwsgierig geworden?" onderaan pagina's
        file: data/instellingen/cta.json
        fields:
          - name: titel
            label: Titel
            widget: string
            hint: >-
              Staat onderaan Activiteiten, Besturen, Geschiedenis, Kasten en Verbanden. (Open
              avonden, VVGSD en Veelgestelde vragen hebben een eigen versie, die pas je bij die
              pagina aan.)
          - name: tekst
            label: Tekst
            widget: text
          - name: knopOpenAvonden
            label: Tekst op de witte knop (naar open avonden)
            widget: string
          - name: knopLidWorden
            label: Tekst op de tweede knop (lid worden)
            widget: string
      - name: footer
        label: Footer (onderaan elke pagina)
        file: data/instellingen/footer.json
        fields:
          - name: tekst
            label: Korte omschrijving onder het logo
            widget: text
          - name: copyright
            label: Regel linksonder
            widget: string
          - name: slogan
            label: Regel rechtsonder
            widget: string
